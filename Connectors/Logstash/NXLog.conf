DateFormat YYYY-MM-DDThh:mm:ss.sUTC
<Extension json>
    Module xm_json
</Extension>

<Input wef>
    Module  im_msvistalog
    Channel ForwardedEvents

    <Exec>
        $TimeGenerated   = $EventTime;
        $Computer        = $Hostname;
        $Provider        = $SourceName;
        $EventRecordId   = $RecordNumber;
        $SystemProcessId = $ProcessID;
        $SystemThreadId  = $ThreadID;
        $CollectorHost = hostname_fqdn();
        $SourceSystem = $CollectorHost + " - NXLog";

        if defined($Message)
        {
            $EventData = $Message;
        }

        # Native Security audit events normally use Level 0 / LogAlways.
        if $Channel == 'Security'
        {
            $Level          = 0;
            $EventLevel     = 0;
            $EventLevelName = 'LogAlways';
        }
        else if $SeverityValue == 5
        {
            $Level          = 1;
            $EventLevel     = 1;
            $EventLevelName = 'Critical';
        }
        else if $SeverityValue == 4
        {
            $Level          = 2;
            $EventLevel     = 2;
            $EventLevelName = 'Error';
        }
        else if $SeverityValue == 3
        {
            $Level          = 3;
            $EventLevel     = 3;
            $EventLevelName = 'Warning';
        }
        else if $SeverityValue == 2
        {
            $Level          = 4;
            $EventLevel     = 4;
            $EventLevelName = 'Information';
        }
        else
        {
            $Level          = 5;
            $EventLevel     = 5;
            $EventLevelName = 'Verbose';
        }
    </Exec>
</Input>

<Output out>
    Module om_udp
    Host   192.168.94.145
    Port   5044
    Exec   to_json();
</Output>

<Route 1>
    Path wef => out
</Route>
 
